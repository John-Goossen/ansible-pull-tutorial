---

- name: Basic system setup
  hosts: localhost
  connection: local
  become: true

  vars_files:
    - vars/main.yml

  tasks:

   - name: Install packages and keep them updated
     ansible.builtin.package:
       name: "{{ packages }}"
       state: latest

   - name: Set the system timezone
     ansible.builtin.file:
       src: "/usr/share/zoneinfo/{{ system_timezone }}"
       dest: /etc/localtime
       state: link
       force: true

   - name: Create the admin user
     ansible.builtin.user:
       name: "{{ admin_user }}"
       groups: "{{ admin_group }}"
       append: true
       password: "$6$rounds=656000$V/9kXBW2XiEQ0e4y$6NTdxhzcBGav7HcHAxlI2bpWPC6fcdf4MSw4a0sthA5rw7XgqebGZ/f/i8bWrITnWJELgk9XEyzz3w9Nuo5Ww/"
       shell: /bin/bash
       create_home: true

   - name: Create the Manager user
     ansible.builtin.user:
       name: "GirlBoss"
       groups: "{{ admin_group }}"
       append: true
       password: "$6$rounds=656000$MAuR9GAQ7BtRrugO$j5NgFHi399MVQCwYyPkEcTZwy1tNpprDMyCHjty/a1P5KH2mc492Uxh/m.z/MA39ixbOOsM0dXW0rBGtwsyqg1"
       shell: /bin/bash
       create_home: true

   - name: Create the Student user
     ansible.builtin.user:
       name: "Student"
       groups: "users"
       append: true
       password: "$6$rounds=656000$zdHfq4XQw20W/cDS$OmrGXzsHaCOA.jPlMo2uOrr/VVDzwHFh2I7vrHYYduxvkOq9O0buQ6hJJzNh/YZUrKem3rArYaFZWBrJvf1PA/"
       shell: /bin/bash
       create_home: true

   - name: Allow the admin group access to sudo without a password
     ansible.builtin.copy:
       content: "%{{ admin_group }} ALL=(ALL) NOPASSWD: ALL\n"
       dest: /etc/sudoers.d/99-ansible
       owner: root
       group: root
       mode: "0440"
       validate: "visudo -cf %s"

   - name: Write a message of the day
     ansible.builtin.copy:
       content: |
         **********
         {{ ansible_facts['hostname'] }} is managed by ansible-pull
         {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
         Last applied: {{ ansible_date_time.iso8601 }}
         **********
       dest: /etc/motd
       owner: root
       group: root
       mode: "0644"

   - name: Make sure a service is enabled and running
     ansible.builtin.service:
       name: "{{ managed_service }}"
       state: started
       enabled: true

   - name: Schedule ansible-pull to run every 30 minutes
     ansible.builtin.cron:
       name: ansible-pull
       user: root
       minute: "*/30"
       job: "/usr/bin/ansible-pull -o -U {{ ansible_pull_repo }} >> /var/log/ansible-pull.log"
       cron_file: ansible-pull

    # --- COMMON SETUP ---

    - name: Ensure dependencies for repository management are present
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - curl
          - gnupg
        state: present
        update_cache: yes

    - name: Create directory for custom repository keys
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'


    # --- GOOGLE CHROME INSTALLATION ---

    - name: Download Google's official GPG signing key
      ansible.builtin.get_url:
        url: https://google.com
        dest: /etc/apt/keyrings/google-chrome.asc
        mode: '0644'

    - name: Add Google Chrome repository source configuration
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.asc] http://google.com stable main"
        filename: google-chrome
        state: present


    # --- VISUAL STUDIO CODE INSTALLATION ---

    - name: Download Microsoft's official GPG signing key
      ansible.builtin.get_url:
        url: https://packages.microsoft.com/keys/microsoft.asc
        dest: /etc/apt/keyrings/microsoft.asc
        mode: '0644'

    - name: Add Visual Studio Code repository source configuration
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft.asc] https://packages.microsoft.com/repos/vscode stable main"
        filename: vscode
        state: present


    # --- FINAL PACKAGE DEPLOYMENT ---

    - name: Install apps and Python tools from all configured repositories
      ansible.builtin.apt:
        name:
          - google-chrome-stable
          - code
          - python3
          - python3-pip
          - python3-venv
        state: present
        update_cache: yes
